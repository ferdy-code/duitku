[project]
name = "duitku"
version = "0.1.0"
description = "Personal-finance AI agent on Telegram (Indonesian)"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "httpx==0.28.1",
    "langchain-core==1.6.9",
    "langchain-openai==1.7.0",
    "langgraph==1.2.14",
    "langgraph-checkpoint-postgres==3.1.2",
    "openai==3.29.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "pgvector==0.5.1",
    "psycopg[binary,pool]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "python-telegram-bot==22.8",
    "sentence-transformers==6.1.0",
    "sqlalchemy[asyncio]==2.1.4",
    # Direct dep only so [tool.uv.sources] can route it to the CPU wheel index (see below).
    "torch==2.14.1",
]

# Linux: CPU-only torch (PyPI default pulls multi-GB CUDA libs). The app only embeds short texts.
[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pyyaml==6.0.3",
    "ruff==0.17.0",
    "types-pyyaml==6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]  # ruff 0.17 also formats code blocks in .md; docs are not code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.pyright]
include = ["src", "tests", "experiments"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# langgraph is a namespace package (no __init__.py) so strict mode reports missing stubs.
reportMissingTypeStubs = "none"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]  # lets tests import sibling helpers as `tests.evals.*` (importlib mode adds nothing)
addopts = "--import-mode=importlib -m 'not eval and not embedding'"
markers = [
    "eval: real-LLM eval cases (needs LLM_API_KEY); run with `pytest -m eval`",
    "embedding: real embedding model (downloads ~470MB from HuggingFace); run with `pytest -m embedding`",
]
